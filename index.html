<!DOCTYPE html>
<!-- Infinite Table — platform lobby. Version: 1.7.2 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Infinite Table</title>
<meta name="description" content="Card games with your mates. No installs, no emails, no ads.">
<meta property="og:title" content="Infinite Table">
<meta property="og:description" content="Card games with your mates.">
<meta property="og:type" content="website">
<meta property="og:image" content="/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#121A16">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --table-night:#121A16; --felt-green:#1D2B25; --felt-highlight:#29392F;
  --text-ivory:#F2EEE2; --text-faint:rgba(242,238,226,.55);
  --card-ivory:#F7F2E6; --card-edge:#D9D2C0; --ink-black:#24241D; --muted-ink:#6E6C5E;
  --primary-coral:#E26A4B; --primary-coral-deep:#BC4F37; --money-gold:#BE8F41;
  --line-soft:rgba(242,238,226,.13);
  --p-amber:#E0AB52; --p-teal:#3B8B82; --p-coral:#D4756B; --p-purple:#7F6595; --p-sky:#6394B6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden;
  font-family:'Nunito Sans',system-ui,sans-serif;color:var(--text-ivory);
  background:var(--felt-green);min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:0 20px calc(28px + env(safe-area-inset-bottom));
}
header{text-align:center;padding:56px 0 34px}
.logo{font-family:'Lilita One',cursive;font-size:34px;letter-spacing:1px;line-height:1.05}
.logo .inf{color:var(--money-gold)}
.tag{font-size:11px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;opacity:.4;margin-top:8px}
main{width:100%;max-width:370px;display:flex;flex-direction:column;gap:16px;padding:0 6px}
.game{
  display:block;text-decoration:none;color:var(--ink-black);
  background:linear-gradient(168deg,#FFFDF6 0%,var(--card-ivory) 55%,#EFE8D3 100%);
  border:1px solid rgba(10,25,26,.35);border-radius:16px;overflow:hidden;
  box-shadow:0 2px 5px rgba(8,12,10,.3), 0 10px 24px rgba(8,12,10,.22);
  transition:transform .15s cubic-bezier(.2,1.1,.3,1), box-shadow .15s;
}
.game:active{transform:translateY(-4px) scale(1.01);box-shadow:0 16px 30px rgba(8,12,10,.4)}
.gband{height:8px;display:flex}
.gband span{flex:1}
.gbody{padding:16px 18px 15px;display:flex;align-items:center;gap:14px}
.ginfo{flex:1;min-width:0}
.gname{font-family:'Lilita One',cursive;font-size:21px;letter-spacing:.3px}
.gdesc{font-size:12px;font-weight:700;color:var(--muted-ink);margin-top:3px;line-height:1.4}
.gplay{
  font-family:'Lilita One',cursive;font-size:14px;color:#fff;flex:0 0 auto;
  background:linear-gradient(180deg,var(--primary-coral),var(--primary-coral-deep));
  border-radius:11px;padding:10px 20px;
  box-shadow:0 3px 8px rgba(188,79,55,.35), inset 0 1px 0 rgba(255,255,255,.25);
}
.gmeta{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--money-gold);padding:0 18px 13px}
.game.soon{
  background:none;border:2px dashed var(--line-soft);box-shadow:none;color:var(--text-faint);
  display:flex;align-items:center;justify-content:center;min-height:88px;
  font-size:12.5px;font-weight:800;letter-spacing:.6px;
}
.game.soon:active{transform:none}
footer{margin-top:auto;padding-top:40px;font-size:10.5px;font-weight:700;opacity:.3}
.game.hero{position:relative;overflow:visible;padding-top:16px}
.herofan{position:absolute;top:-26px;left:50%;transform:translateX(-50%);width:112px;height:66px;pointer-events:none;filter:drop-shadow(0 5px 9px rgba(8,12,10,.3))}
.fcard{
  position:absolute;left:var(--fx);top:var(--fy,0px);width:40px;height:58px;border-radius:5px;
  background:#F7F2E6;
  transform:rotate(var(--fr));transform-origin:50% 145%;
  transition:transform .35s cubic-bezier(.2,.9,.3,1);
  box-shadow:inset 0 0 0 1px rgba(36,36,29,.22);
}
.fcard::before{content:'';position:absolute;top:0;left:0;right:0;height:17px;border-radius:5px 5px 0 0;
  background:var(--fc);box-shadow:inset 0 -1px 0 rgba(36,36,29,.15)}
.fcard::after{content:'';position:absolute;left:6px;right:12px;top:24px;height:4px;border-radius:2px;
  background:rgba(36,36,29,.28);
  box-shadow:0 9px 0 -1px rgba(36,36,29,.16);}
.fcard.fmoney{background:linear-gradient(172deg,#EDCB6B 0%,#D9A03F 60%,#C08A2E 100%)}
.fcard.fmoney::before{content:'';position:absolute;inset:3.5px;top:3.5px;left:3.5px;right:3.5px;height:auto;border-radius:3px;
  background:none;border:1.2px solid rgba(244,239,229,.75);box-shadow:none}
.fcard.fmoney::after{content:'';position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
  background:var(--card-ivory);box-shadow:inset 0 -2px 3px rgba(36,36,29,.28)}
.fcard.frainbow::before{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);
  background:linear-gradient(90deg,#E84A4A,#F0912E,#EFD22F,#3FBF5E,#2FBBD6,#4A6CE8,#A44AE0,#E84A8F,#E84A4A);
  background-size:400% 100%;
  animation:rainbowflow 7s linear infinite;}
@keyframes rainbowflow{to{background-position:400% 0}}
@media (prefers-reduced-motion: reduce){ .fcard.frainbow::before{animation:none} }
.game.hero:active .fcard{transform:rotate(calc(var(--fr)*1.45)) translateY(-5px)}
.game.hero .gbody{position:relative;z-index:2}
.gplayers{margin-top:9px;font-size:10px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:#24241D;opacity:.4}
.game.hero.mafiacard{padding-top:16px;background:linear-gradient(168deg,#1B2A44 0%,#12203A 55%,#0A1220 100%);border-color:rgba(244,239,229,.2)}
.game.hero.mafiacard .gname,.game.hero.mafiacard .gdesc{color:var(--card-ivory)}
.game.hero.mafiacard .gdesc{opacity:.75}
.game.hero.mafiacard .gplayers{color:var(--card-ivory);opacity:.4}
.game.hero.pitchcard{padding-top:16px;background:linear-gradient(168deg,#2F8340 0%,#27703A 55%,#1B5030 100%);border-color:rgba(244,239,229,.22)}
.game.hero.pitchcard .gname,.game.hero.pitchcard .gdesc{color:var(--card-ivory)}
.game.hero.pitchcard .gdesc{opacity:.8}
.game.hero.pitchcard .gplayers{color:var(--card-ivory);opacity:.45}
.game.hero.feltcard{padding-top:16px;background:radial-gradient(120% 160% at 20% 0%,#1F6F43 0%,#175634 52%,#0E3A22 100%);border-color:rgba(232,198,59,.28)}
.game.hero.feltcard .gname,.game.hero.feltcard .gdesc{color:var(--card-ivory)}
.game.hero.feltcard .gdesc{opacity:.8}
.game.hero.feltcard .gplayers{color:var(--card-ivory);opacity:.45}
.game.hero.duelcard{padding-top:16px;background:linear-gradient(168deg,#3D2019 0%,#2B1712 55%,#170C09 100%);border-color:rgba(226,106,75,.3)}
.game.hero.duelcard .gname,.game.hero.duelcard .gdesc{color:var(--card-ivory)}
.game.hero.duelcard .gdesc{opacity:.8}
.game.hero.duelcard .gplayers{color:var(--card-ivory);opacity:.45}
.game.soon{display:flex;align-items:center;justify-content:space-between;padding:16px 18px}
.soonname{font-weight:800;font-size:14px;opacity:.55}
.soondesc{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.3}
body{font-variant-numeric:tabular-nums}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(130% 95% at 50% 24%, transparent 52%, rgba(6,10,8,.34));
}
body>*{position:relative;z-index:1}
@media (prefers-reduced-motion: no-preference){
  header, header~*:not(#overlay){opacity:0;transform:translateY(12px);animation:pagein .55s cubic-bezier(.2,.9,.3,1) forwards}
  header{animation-delay:.04s}
  header~*:nth-of-type(1){animation-delay:.14s}
  header~*:nth-of-type(2){animation-delay:.22s}
  header~*:nth-of-type(3){animation-delay:.30s}
  header~*:nth-of-type(4){animation-delay:.38s}
}
@keyframes pagein{to{opacity:1;transform:none}}
#overlay{animation:none}
.homebtn{position:relative;transition:transform .12s ease, filter .12s ease}
.homebtn:active{transform:scale(.97);filter:brightness(1.08)}
.homebtn.busy{pointer-events:none;opacity:.75}
.homebtn.busy::after{content:'…';position:absolute;right:14px;animation:busypulse 1s ease infinite}
@keyframes busypulse{50%{opacity:.25}}

button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="inf">INFINITE</span> TABLE</div>
</header>

<main>
  <a class="game hero" href="./coastline/">
    <div class="herofan" aria-hidden="true">
      <span class="fcard" style="--fr:-14deg;--fx:0px;--fc:#2E5EAA;--fy:7px"></span>
      <span class="fcard" style="--fr:-5deg;--fx:24px;--fc:#C8433A;--fy:1px"></span>
      <span class="fcard fmoney" style="--fr:4deg;--fx:48px;--fy:1px"></span>
      <span class="fcard frainbow" style="--fr:13deg;--fx:72px;--fy:7px"></span>
    </div>
    <div class="gbody">
      <div class="ginfo">
        <div class="gname">M Deal</div>
        <div class="gdesc">Build sets, charge rent, raid your mates.</div>
        <div class="gplayers">2–5 Players</div>
      </div>
      <span class="gplay">PLAY</span>
    </div>
  </a>


  

  <a class="game hero feltcard" href="./pool/">
    <div class="gbody">
      <div class="ginfo">
        <div class="gname">8-Ball</div>
        <div class="gdesc">Rack, break, run the table.</div>
        <div class="gplayers">2 Players</div>
      </div>
      <span class="gplay">PLAY</span>
    </div>
  </a>

  <a class="game hero duelcard" href="./duel/">
    <div class="gbody">
      <div class="ginfo">
        <div class="gname">Duel</div>
        <div class="gdesc">First to ten. Draft a power every round.</div>
        <div class="gplayers">2+ Players</div>
      </div>
      <span class="gplay">PLAY</span>
    </div>
  </a>

  <a class="game hero" href="./lastcard/">
    <div class="gbody">
      <div class="ginfo">
        <div class="gname">Last Card</div>
        <div class="gdesc">Shed fast, sting harder, call your last.</div>
        <div class="gplayers">2–5 Players</div>
      </div>
      <span class="gplay">PLAY</span>
    </div>
  </a>
</main>

<footer>Infinite Table</footer>

<script src="./shared/config.js?v=1.7.2"></script>
</body>
</html>
