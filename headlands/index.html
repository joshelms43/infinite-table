<!doctype html>
<html lang="en">
<head>
<!-- Headlands — Infinite Table. Version: 0.6.0
     Rival towns on one coast. Draw goods, work the market row, chain Tracks
     for cheaper swaps, raise Shacks (every one makes a Headline), stack Towns
     and Resorts, claim the Highway and the Watch. First to 7 showing wins.
     Host-authoritative over TableKit broadcast, same shape as M Deal and Last
     Card: clients send intents, the host owns the engine and pushes truth
     plus each seat's private hand. Practice mode runs the engine locally
     against bots. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101A16">
<title>Headlands — Infinite Table</title>
<style>
:root{
  --felt:#0E1814; --felt-2:#14211B; --panel:#1B2A23; --line:#2C4038;
  --bone:#F2EEE2; --bone-2:#E7E0CC; --ink:#1C1A14; --dim:#93A69A;
  --coral:#E26A4B; --teal:#3B8B82; --gold:#E8C57A; --warn:#D9A03F;
  --clay:#C96F4A; --timber:#6B8F4E; --wool:#EFE9D8; --cane:#E3B95E; --stone:#8B95A3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{color:var(--bone);font-family:Georgia,'Times New Roman',serif;
  background:radial-gradient(120% 90% at 50% 0%, #15241D 0%, var(--felt) 58%, #0A110E 100%);
  -webkit-user-select:none;user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hidden{display:none!important}
button{font-family:inherit;color:var(--bone);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 18px;font-size:16px;cursor:pointer}
button.primary{background:var(--gold);border-color:transparent;color:var(--ink);font-weight:700}
button.busy{opacity:.45;pointer-events:none}
input{font-family:inherit;font-size:16px;color:var(--bone);background:var(--felt-2);
  border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}

/* ---- menu + room ---- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:24px;text-align:center}
.screen h1{font-size:38px;margin:0;letter-spacing:.5px;color:var(--bone)}
.screen .tag{color:var(--dim);margin:0 0 10px;font-style:italic}
.col{display:flex;flex-direction:column;gap:10px;width:min(320px,86vw)}
.code{font-size:40px;letter-spacing:10px;font-weight:700;color:var(--gold)}
.seatrow{display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.seatrow .dot{width:9px;height:9px;border-radius:50%;background:var(--teal)}
.hosttag{margin-left:auto;font-size:12px;color:var(--gold)}
.err{color:var(--coral);min-height:20px}
.hint{color:var(--dim);min-height:20px}
#menuart{width:min(300px,78vw);margin-bottom:-6px}

/* ---- the table ---- */
#game{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px)}
.vpbadge{background:var(--gold);color:var(--ink);font-weight:700;border-radius:8px;
  padding:0 7px;font-size:13px;line-height:19px}
.tok{font-size:11px;background:rgba(232,197,122,.14);border:1px solid var(--gold);
  color:var(--gold);border-radius:7px;padding:1px 6px}

/* ---- the world: one bay, edge to edge, fading into the table ---- */
#worldwrap{position:relative;flex:1 1 0;min-height:120px;width:calc(100% + 20px);
  margin:calc(-8px - env(safe-area-inset-top)) -10px 0;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 93%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 93%,transparent 100%)}
#worldwrap svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
#worldbg,#world,#worldfx{pointer-events:none}
#world text,#worldfx text{font-family:Georgia,'Times New Roman',serif}
#world [data-seat]{cursor:pointer;pointer-events:all}
.cloud{animation:wclouds 130s linear infinite}
@keyframes wclouds{from{transform:translateX(-70px)}to{transform:translateX(430px)}}
.twinkle{animation:twinkle 3.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.ripple{animation:ripple 8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%,70%{transform:scale(.2);opacity:0}76%{opacity:.7}100%{transform:scale(2.4);opacity:0}}
.bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-1.2px) rotate(2.5deg)}}
.blink{animation:blink 2.4s steps(1) infinite}
@keyframes blink{0%,60%{opacity:.15}61%,100%{opacity:1}}
.leap{animation:leap 11s linear infinite;stroke-dashoffset:26;opacity:0}
@keyframes leap{0%,86%{stroke-dashoffset:26;opacity:0}87%{opacity:.9}99%{stroke-dashoffset:-100;opacity:.9}100%{opacity:0}}
.flag{animation:flagwave 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes flagwave{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82) skewY(4deg)}}
.beam{opacity:.13;animation:beam 8s ease-in-out infinite;transform-origin:0 0}
@keyframes beam{0%,100%{transform:rotate(-34deg)}50%{transform:rotate(34deg)}}
.turnglow{opacity:.07;animation:turnglow 2.6s ease-in-out infinite}
@keyframes turnglow{0%,100%{opacity:.04}50%{opacity:.11}}
.popin{animation:popin .55s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:50% 100%}
@keyframes popin{from{transform:scale(.1)}to{transform:scale(1)}}
.fxsail{animation:fxsail 2.6s ease-in-out forwards}
@keyframes fxsail{0%{transform:translate(0,0);opacity:0}9%{opacity:1}90%{opacity:1}
  100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.fxbubble{animation:fxbubble 1.6s ease-out forwards}
@keyframes fxbubble{0%{transform:translateY(4px);opacity:0}16%{opacity:1}70%{opacity:1}
  100%{transform:translateY(-22px);opacity:0}}
.fxpuff{animation:fxpuff .8s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes fxpuff{from{transform:scale(.25);opacity:.85}to{transform:scale(2.3);opacity:0}}
.fxring{animation:fxring 1.2s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes fxring{from{transform:scale(.3);opacity:.9}to{transform:scale(3);opacity:0}}
/* the whole bay answers a Headline */
#worldwrap.tide .tidewash{animation:tidewash 3s ease-in-out}
@keyframes tidewash{0%,100%{opacity:0;transform:translateY(0)}45%,60%{opacity:.5;transform:translateY(-20px)}}
#worldwrap.tide #world{animation:tidelift 3s ease-in-out}
@keyframes tidelift{0%,100%{transform:translateY(0)}45%,60%{transform:translateY(2px)}}
#worldwrap.season .sunglow{animation:sunpulse 2.8s ease-in-out;transform-box:fill-box;transform-origin:center}
@keyframes sunpulse{0%,100%{transform:scale(1);opacity:.16}40%{transform:scale(3.4);opacity:.5}}

#mid{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:11px;padding:10px 0 12px}
#statusline{text-align:center;color:var(--dim);font-size:14px;min-height:18px;font-style:italic}
#market{display:flex;gap:6px;justify-content:center;align-items:flex-end}
.mcard{flex:1 1 0;min-width:0;max-width:62px;aspect-ratio:62/92;border-radius:9px;cursor:pointer;position:relative;
  background:linear-gradient(170deg,var(--bone) 0%,var(--bone-2) 100%);
  border:1px solid rgba(28,26,20,.55);
  box-shadow:0 2px 0 rgba(8,10,8,.55), 0 6px 14px rgba(8,10,8,.4);
  display:flex;flex-direction:column;align-items:center;padding:5px 2px 4px;
  color:var(--ink);transition:transform .12s,box-shadow .2s}
.mcard:active{transform:scale(.94)}
.mcard.canbuy{box-shadow:0 2px 0 rgba(8,10,8,.55), 0 0 0 2px var(--gold), 0 6px 16px rgba(232,197,122,.3);
  transform:translateY(-5px)}
.mcard.standing{margin-left:5px;background:linear-gradient(170deg,#F6EBCB 0%,#E9D9A8 100%)}
.mcard.gone{opacity:.3}
.mcard svg.art{width:62%;height:auto;aspect-ratio:1;margin-top:1px}
.mcard .mname{font-size:10.5px;margin-top:auto;letter-spacing:.1px}
.mcard .pips{display:flex;gap:1px;justify-content:center;margin-top:2px;min-height:8px;width:100%;padding:0 1px}
.mcard .pips svg{flex:0 1 9px;min-width:0;width:9px;height:auto;aspect-ratio:1}
.mcard .pips svg.miss{opacity:.28}
#counts{text-align:center;color:var(--dim);font-size:12px}

#headlineflash{position:fixed;left:0;right:0;top:46vh;display:flex;justify-content:center;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
#headlineflash.show{opacity:1}
#hcard{background:linear-gradient(170deg,var(--bone),var(--bone-2));color:var(--ink);
  border-radius:14px;padding:20px 24px 22px;max-width:300px;text-align:center;
  border:1px solid rgba(28,26,20,.5);
  box-shadow:0 0 0 3px var(--gold), 0 18px 44px rgba(8,10,8,.6);
  transform:scale(.9) rotate(-1.5deg);transition:transform .25s}
#headlineflash.show #hcard{transform:scale(1) rotate(-1.5deg)}
#hcard .hrule{width:56px;height:2px;background:var(--ink);margin:0 auto 10px;opacity:.65}
#hcard .hn{font-size:24px;margin-bottom:6px}
#hcard .hd{font-size:15px;line-height:1.45;color:#3A362B}

#mine{background:linear-gradient(180deg,var(--panel),var(--felt-2));
  border:1.5px solid var(--line);border-radius:16px;
  padding:10px 12px;transition:border-color .25s,box-shadow .25s}
#mine.turn{border-color:var(--gold);box-shadow:0 0 18px rgba(232,197,122,.18)}
#mytop{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);flex-wrap:wrap}
#hand{display:flex;gap:8px;justify-content:center;margin-top:8px}
.good{flex:1 1 0;min-width:0;max-width:58px;height:66px;border-radius:9px;cursor:pointer;position:relative;
  background:linear-gradient(170deg,var(--bone) 0%,var(--bone-2) 100%);
  border:1px solid rgba(28,26,20,.5);
  box-shadow:0 2px 0 rgba(8,10,8,.5), 0 4px 10px rgba(8,10,8,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding-top:7px;color:var(--ink);transition:transform .12s}
.good:active{transform:scale(.93)}
.good svg{width:30px;height:30px}
.good .gn{font-size:10px;margin-top:2px;color:#4A4536}
.good .gc{position:absolute;top:-7px;right:-7px;min-width:21px;height:21px;border-radius:11px;
  background:var(--ink);color:var(--bone);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 5px;
  border:1.5px solid var(--bone)}
.good.zero{opacity:.32;filter:saturate(.4)}
.good.zero .gc{display:none}
#actions{display:flex;gap:8px;margin-top:11px}
#actions button{flex:1;padding:12px 0;font-size:15px;border-radius:11px}

/* ---- sheet ---- */
#sheetwrap{position:fixed;inset:0;background:rgba(8,12,10,.5);z-index:70;display:flex;
  align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
#sheetwrap.show{opacity:1;pointer-events:auto}
#sheet{background:var(--panel);border-top:1.5px solid var(--line);border-radius:18px 18px 0 0;
  width:100%;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(30px);transition:transform .2s;max-height:78vh;overflow-y:auto}
#sheetwrap.show #sheet{transform:none}
#sheet h3{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:10px}
#sheet h3 svg{width:30px;height:30px}
#sheet .sub{color:var(--dim);font-size:14px;margin-bottom:12px;line-height:1.4}
.opt{display:flex;flex-direction:column;background:var(--felt-2);border:1px solid var(--line);
  border-radius:12px;padding:13px 15px;margin-bottom:9px;cursor:pointer}
.opt.off{opacity:.42;pointer-events:none}
.opt .ol{font-size:16px}
.opt .oh{font-size:13px;color:var(--dim);margin-top:3px}
.costrow{display:flex;gap:4px;align-items:center;margin:2px 0 12px}
.costrow svg{width:19px;height:19px}
.costrow svg.miss{opacity:.3}
.tradegrid{display:flex;gap:8px;justify-content:center;margin:8px 0}
.tg{width:48px;height:58px;border-radius:9px;cursor:pointer;position:relative;
  background:linear-gradient(170deg,var(--bone),var(--bone-2));
  border:1px solid rgba(28,26,20,.5);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tg svg{width:24px;height:24px}
.tg .gc{font-weight:700;font-size:13px}
.tg.dis{opacity:.3;pointer-events:none}
.whobtn{padding:8px 14px}
.tlabel{color:var(--dim);font-size:13px;margin:8px 0 2px}

#banner{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;
  transform:translate(-50%,-10px);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:9px 18px;font-size:15px;opacity:0;transition:all .25s;
  z-index:80;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#banner.show{opacity:1;transform:translate(-50%,0)}

#over{position:fixed;inset:0;background:rgba(8,12,10,.78);z-index:90;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
#over h2{font-size:32px;margin:0}
#oversub{color:var(--dim)}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:95;pointer-events:none;
  animation:confall linear forwards}
@keyframes confall{to{transform:translateY(105vh) rotate(560deg);opacity:.5}}
/* ---- the sky behind the table ---- */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#sky .sun{position:absolute;left:9%;top:calc(58% - var(--sunp,0) * 38%);
  width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 42% 38%, #F0D08A 0%, #D9A03F 70%, rgba(217,160,63,0) 72%);
  opacity:calc(.25 + var(--sunp,0) * .45);transition:top 1.2s ease,opacity 1.2s ease}
#sky .dusk{position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(226,106,75,0) 30%, rgba(226,106,75,.22) 100%);
  opacity:var(--duskp,0);transition:opacity 1.2s ease}
#sky svg{position:absolute;left:0;bottom:0;width:100%;height:46%}
#sky .cloud{position:absolute;width:120px;height:26px;opacity:.05;
  background:radial-gradient(ellipse at 30% 60%, var(--bone) 0%, transparent 70%),
    radial-gradient(ellipse at 65% 40%, var(--bone) 0%, transparent 70%);
  animation:clouddrift 110s linear infinite}
#sky .cloud.c2{top:14%;animation-duration:150s;animation-delay:-70s;width:170px;opacity:.04}
#sky .cloud.c1{top:7%}
@keyframes clouddrift{from{left:-20%}to{left:110%}}
.waveband{animation:waveroll 7s linear infinite}
@keyframes waveroll{from{transform:translateX(0)}to{transform:translateX(-48px)}}
#game,.screen,#headlineflash,#sheetwrap,#banner,#over{z-index:1}
body.playing #sky{display:none}
.screen{z-index:2}

/* ---- idle life on the coastlines ---- */
.smoke{animation:smokeup 3.4s ease-out infinite}
@keyframes smokeup{0%{transform:translateY(0);opacity:0}25%{opacity:.4}
  100%{transform:translateY(-9px);opacity:0}}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
.glint{animation:glint 6s ease-in-out infinite}
@keyframes glint{0%,78%,100%{opacity:0}86%{opacity:.6}}

@media (prefers-reduced-motion: reduce){
  .confetti{display:none}
  .mcard,.good,#hcard,#sheet,#banner,#sky .sun,#sky .dusk{transition:none}
  .smoke,.sway,.glint,.waveband,#sky .cloud,.cloud,.twinkle,.ripple,.bob,.flag,.beam,.turnglow,.popin,.blink,.leap{animation:none}
}
</style>
</head>
<body>

<div id="sky" aria-hidden="true">
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <span class="sun"></span>
  <svg viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice" fill="none">
    <path d="M0 78C56 46 108 30 150 36c34 5 52 26 82 32 44 9 102-18 168-8v60H0Z" fill="#132019"/>
    <path d="M0 96C70 72 150 60 226 70c66 9 120 2 174 14v36H0Z" fill="#0E1813"/>
    <g class="waveband" stroke="#2C6B63" stroke-width="2" stroke-linecap="round" opacity=".5">
      <path d="M-48 104c8-5 16-5 24 0s16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0"/>
      <path d="M-48 114c8-5 16-5 24 0s16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0 16-5 24 0 16 5 24 0" opacity=".6"/>
    </g>
  </svg>
  <div class="dusk"></div>
</div>

<div id="menu" class="screen">
  <svg id="menuart" viewBox="0 0 300 120" fill="none" stroke="#1C1A14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="246" cy="30" r="14" fill="#E8C57A"/>
    <path d="M0 86C40 60 70 40 96 44c20 3 28 20 46 24" fill="#3B8B82" stroke="none" opacity=".9"/>
    <path d="M0 86C40 60 70 40 96 44c20 3 28 20 46 24" />
    <path d="M62 54l10-9 10 9" fill="none"/>
    <rect x="64.5" y="53" width="15" height="11" fill="#D98059"/>
    <path d="M300 92c-44-22-76-40-104-38-24 2-34 22-54 28" fill="#6B8F4E" stroke="none" opacity=".9"/>
    <path d="M300 92c-44-22-76-40-104-38-24 2-34 22-54 28"/>
    <path d="M208 62V40" stroke-width="2.4"/><path d="M208 40h16l-4.5 5 4.5 5h-16" fill="#E26A4B"/>
    <path d="M0 96c25-8 50-8 75 0s50 8 75 0 50-8 75 0 50 8 75 0" stroke="#3B8B82" stroke-width="2.6"/>
    <path d="M0 108c25-8 50-8 75 0s50 8 75 0 50-8 75 0 50 8 75 0" stroke="#2C6B63" stroke-width="2.2" opacity=".7"/>
  </svg>
  <h1>Headlands</h1>
  <p class="tag">Rival towns on one coast. First to seven.</p>
  <div class="col">
    <input id="namein" maxlength="14" placeholder="Your name">
    <button class="primary" id="practicebtn">Practice</button>
    <button id="hostbtn">Host a Table</button>
    <div style="display:flex;gap:8px">
      <input id="codein" maxlength="4" placeholder="CODE" style="text-transform:uppercase;letter-spacing:4px;text-align:center">
      <button id="joinbtn">Join</button>
    </div>
    <div class="err" id="neterr"></div>
  </div>
</div>

<div id="room" class="screen hidden">
  <h1>Headlands</h1>
  <div class="code" id="codeshow"></div>
  <div class="col" id="seatlist"></div>
  <div class="hint" id="roomhint"></div>
  <button class="primary" id="startbtn">Deal</button>
  <button id="leaveroom">Leave</button>
</div>

<div id="game" class="hidden">
  <div id="worldwrap">
    <svg id="worldbg" viewBox="0 0 360 296" preserveAspectRatio="xMidYMax meet"></svg>
    <svg id="world" viewBox="0 0 360 296" preserveAspectRatio="xMidYMax meet"></svg>
    <svg id="worldfx" viewBox="0 0 360 296" preserveAspectRatio="xMidYMax meet"></svg>
  </div>
  <div id="mid">
    <div id="statusline"></div>
    <div id="market"></div>
    <div id="counts"></div>
  </div>
  <div id="mine">
    <div id="mytop"></div>
    <div id="hand"></div>
    <div id="actions">
      <button id="tradebtn">Trade</button>
      <button class="primary" id="endbtn">End Turn</button>
    </div>
  </div>
</div>

<div id="headlineflash"><div id="hcard"><div class="hrule"></div><div class="hn"></div><div class="hd"></div></div></div>

<div id="sheetwrap"><div id="sheet"></div></div>
<div id="banner"></div>

<div id="over" class="hidden">
  <h2 id="overtitle"></h2>
  <div id="oversub"></div>
  <button class="primary" id="againbtn">Again</button>
  <button id="menubtn">Menu</button>
</div>

<script src="../shared/config.js?v=0.6.0"></script>
<script src="../shared/tablekit.js?v=0.6.0"></script>
<script src="../shared/headlands-rules.js?v=0.6.0"></script>
<script>
'use strict';
var VERSION = '0.6.0';
TableKit.watchErrors({ game: 'headlands', version: VERSION, onError: function (m) { banner(m); } });

function $(id) { return document.getElementById(id); }
function show(id) { $(id).classList.remove('hidden'); }
function hide(id) { $(id).classList.add('hidden'); }
function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function haptic(v) { try { if (navigator.vibrate) navigator.vibrate(v); } catch (e) {} }

var bannerT = null;
function banner(text, ms) {
  var b = $('banner');
  b.textContent = text;
  b.classList.add('show');
  clearTimeout(bannerT);
  bannerT = setTimeout(function () { b.classList.remove('show'); }, ms || 1900);
}

/* ---- sound: the house synth ---- */
var AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  return AC;
}
function sfx(kind) {
  var ctx = ac();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();

  /* the far shore runs the whole horizon; the near shore the whole foreground */
  out += '<path d="' + ridge(farY, -296, 656, 8) + 'V' + (WORLD.far + 22) + 'H-296Z" fill="#1C3527" stroke="none"/>' +
    '<path d="' + ridge(farY, -296, 656, 8) + '" stroke="#2F5A3C" stroke-width="1.6"/>' +
    '<path d="M-300 ' + (WORLD.far + 21) + 'q30 4 60 0t60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0 60 0" stroke="#5FB5AA" stroke-width="1" opacity=".5"/>';
  var near = '<path d="' + ridge(nearY, -296, 656, 8) + 'V' + (WORLD.vh + 50) + 'H-296Z" fill="#234331" stroke="none"/>' +
    '<path d="' + ridge(nearY, -296, 656, 8) + '" stroke="#3B6B49" stroke-width="2"/>';
  var farBits = '', nearBits = '', labels = '', hits = '';

  V.players.forEach(function (p, s) {
    var Ls = L[s], col = SEATCOL[s % 4], sc = Ls.sc, fn = Ls.fn, bits = '';
    var isTurn = V.turn === s && !V.over;
    if (isTurn) {
      bits += '<ellipse class="turnglow" cx="' + ((Ls.x0 + Ls.x1) / 2) + '" cy="' + (fn(Ls.mid) - 4 * sc).toFixed(1) +
        '" rx="' + ((Ls.x1 - Ls.x0) / 2) + '" ry="' + (20 * sc) + '" fill="#E8C57A" stroke="none"/>';
    }
    /* the dock and the boat moored at it */
    if (Ls.far) {
      bits += '<path d="M' + Ls.dock.x + ' ' + (fn(Ls.dock.x) + 2).toFixed(1) + 'V' + (Ls.dock.y - 3).toFixed(1) + '" stroke="#8F6B42" stroke-width="3.2"/>' +
        '<g transform="translate(' + (Ls.dock.x + 9) + ' ' + (Ls.dock.y - 5).toFixed(1) + ') scale(.62)">' + boatShape(col, false) + '</g>';
    } else {
      bits += '<path d="M' + Ls.dock.x + ' ' + nearY(Ls.dock.x).toFixed(1) + 'V' + Ls.dock.y + '" stroke="#8F6B42" stroke-width="6"/>' +
        '<path d="M' + (Ls.dock.x - 5) + ' ' + Ls.dock.y + 'h10" stroke="#6B4E2E" stroke-width="2.4"/>' +
        '<g transform="translate(' + (Ls.dock.x + 16) + ' ' + (Ls.dock.y - 1) + ') scale(1.05)">' + boatShape(col, false) + '</g>';
    }
    /* the track: longer with each one laid; the Highway is gold and busy */
    if (p.tracks > 0) {
      var tEnd = Ls.x0 + 3 + (Ls.x1 - Ls.x0 - 6) * (0.16 + 0.84 * Math.min(p.tracks, 6) / 6);
      var td = ridge(function (x) { return fn(x) + 1.6 * sc; }, Ls.x0 + 3, Math.round(tEnd), 6);
      var hw = V.highway === s;
      bits += '<path d="' + td + '" stroke="#1C1A14" stroke-width="' + (4.4 * sc).toFixed(1) + '"/>' +
        '<path d="' + td + '" stroke="' + (hw ? '#E8C57A' : '#C9A26B') + '" stroke-width="' + (3 * sc).toFixed(1) + '"/>';
      if (hw) {
        bits += '<g><g transform="scale(' + sc + ')"><rect x="-3.4" y="-5.6" width="6.8" height="3.6" rx=".8" fill="#E26A4B" stroke-width="' + (1 / sc).toFixed(2) + '"/>' +
          '<circle cx="-2" cy="-1.4" r="1.3" fill="#1C1A14" stroke="none"/><circle cx="2" cy="-1.4" r="1.3" fill="#1C1A14" stroke="none"/></g>' +
          '<animateMotion dur="' + (5 + p.tracks) + 's" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;0" keyTimes="0;0.5;1" path="' + td + '"/></g>';
      }
    }
    /* the buildings */
    var prev = WORLD.prev[s] || [], extra = 0;
    p.stacks.forEach(function (st, i) {
      if (i >= 5) { extra++; return; }
      var x = slotX(Ls, i), gy = fn(x);
      var fresh = WORLD.prev[s] && prev[i] !== st.top;
      bits += bldg(st.top, x, gy, sc, col, lit, fresh, ((i * 1.3 + s * 0.7) % 3.2).toFixed(1));
      if (fresh) WORLD.puffs.push({ x: x, y: gy - 6 * sc, r: 9 * sc });
    });
    if (extra > 0) {
      bits += '<text x="' + (slotX(Ls, 4) + 14 * sc).toFixed(1) + '" y="' + (fn(slotX(Ls, 4)) - 4 * sc).toFixed(1) +
        '" font-size="' + (7 * sc + 3).toFixed(1) + '" fill="#F2EEE2" stroke="none">+' + extra + '</text>';
    }
    /* rangers hold the point; the Watch is a lighthouse sweeping the bay */
    var rx0 = Ls.x0 + (Ls.x1 - Ls.x0) * 0.7;
    for (var r = 0; r < Math.min(p.rangers, 3); r++) {
      var rx = rx0 + r * 7.5 * sc, ry = fn(rx);
      bits += '<g transform="translate(' + rx.toFixed(1) + ' ' + ry.toFixed(1) + ') scale(' + sc + ')" stroke-width="' + (1.05 / sc).toFixed(2) + '">' +
        '<path d="M0 0V-11"/><path class="flag" d="M0 -11h6l-1.8 2 1.8 2H0Z" fill="' + col + '"/></g>';
    }
    if (p.rangers > 3) {
      bits += '<text x="' + (rx0 + 24 * sc).toFixed(1) + '" y="' + (fn(rx0) - 3 * sc).toFixed(1) + '" font-size="' + (6 * sc + 3).toFixed(1) +
        '" fill="#F2EEE2" stroke="none">+' + (p.rangers - 3) + '</text>';
    }
    if (V.watch === s) {
      var lx = Ls.x1 - 9 * sc, ly = fn(lx);
      bits += '<g transform="translate(' + lx.toFixed(1) + ' ' + ly.toFixed(1) + ') scale(' + sc + ')" stroke-width="' + (1.05 / sc).toFixed(2) + '">' +
        '<g transform="translate(0 -19) rotate(' + (Ls.far ? 90 : -90) + ')"><path class="beam" d="M0 0L' + (Ls.far ? 84 : 120) + ' -15V15Z" fill="#F6D77A" stroke="none"/></g>' +
        '<path d="M-3.4 0L-2.2 -16h4.4L3.4 0Z" fill="#F2EEE2"/><path d="M-2.9 -6h5.8M-2.5 -11h5" stroke="' + col + '" stroke-width="' + (2.2 / sc).toFixed(2) + '"/>' +
        '<rect x="-3" y="-21" width="6" height="5" rx="1" fill="#F6D77A"/><path d="M-4 -21h8L0 -25Z" fill="' + col + '"/></g>';
    }
    if (Ls.far) farBits += bits; else nearBits += bits;

    /* names ride above the far towns; tap a town for the full story */
    if (Ls.far) {
      var ly2 = farY(Ls.mid) - 22 * sc - 8;
      var nm = esc(p.name.length > 9 ? p.name.slice(0, 8) + '…' : p.name);
      labels += '<g' + (isTurn ? ' class="nameturn"' : '') + '>' +
        '<circle cx="' + (Ls.mid - 30) + '" cy="' + (ly2 - 3.6).toFixed(1) + '" r="3.2" fill="' + col + '" stroke="#1C1A14" stroke-width=".8"/>' +
        '<text x="' + (Ls.mid - 24) + '" y="' + ly2.toFixed(1) + '" font-size="11.5" fill="' + (isTurn ? '#E8C57A' : '#F2EEE2') + '" stroke="none" font-weight="700">' + nm + '</text>' +
        '<rect x="' + (Ls.mid + 22) + '" y="' + (ly2 - 10.4).toFixed(1) + '" width="16" height="13" rx="4" fill="#E8C57A" stroke="none"/>' +
        '<text x="' + (Ls.mid + 30) + '" y="' + (ly2 - .4).toFixed(1) + '" font-size="10.5" fill="#1C1A14" stroke="none" font-weight="700" text-anchor="middle">' + p.vp + '</text>' +
        '<text x="' + Ls.mid + '" y="' + (ly2 - 14).toFixed(1) + '" font-size="8.6" fill="#B9C9BE" stroke="none" text-anchor="middle">' + p.handN + (p.handN === 1 ? ' card' : ' cards') + '</text></g>';
      hits += '<rect data-seat="' + s + '" x="' + Ls.x0 + '" y="' + (ly2 - 26).toFixed(1) + '" width="' + (Ls.x1 - Ls.x0) + '" height="' + (farY(Ls.mid) - ly2 + 52).toFixed(1) + '" fill="transparent" stroke="none"/>';
    } else {
      hits += '<rect data-seat="' + s + '" x="0" y="' + (WORLD.near - 34) + '" width="360" height="90" fill="transparent" stroke="none"/>';
    }
  });
  return out + farBits + near + nearBits + labels + hits + '</g>';
}

function renderWorld() {
  var wrap = $('worldwrap');
  if (!wrap) return;
  var lead = 0;
  V.players.forEach(function (pp) { lead = Math.max(lead, pp.vp); });
  var prog = Math.min(1, lead / H.WIN_VP);
  var lit = prog >= 0.57;

  /* backdrop: once per table and frame shape */
  sizeWorld();
  var bgKey = V.players.length + ':' + MYSEAT + ':' + WORLD.vh;
  if (WORLD.bgFor !== bgKey) {
    WORLD.bgFor = bgKey; WORLD.sig = ''; WORLD.prev = {};
    $('worldbg').innerHTML = worldBackdrop();
  }
  /* the sun sinks as the leader closes on seven; dusk and stars follow */
  var sy = (WORLD.far * (0.24 + prog * 0.7)).toFixed(1);
  var set = function (id, k, v) { var e = $(id); if (e && e.setAttribute) e.setAttribute(k, v); };
  set('wsun', 'cy', sy); set('wsunglow', 'cy', sy);
  set('wdusk2', 'opacity', (prog * prog * 0.9).toFixed(2));
  set('wstars', 'opacity', Math.max(0, (prog - 0.6) * 2.2).toFixed(2));
  set('wglow', 'opacity', (0.05 + prog * 0.16).toFixed(2));

  var sig = JSON.stringify([V.turn, V.over, V.highway, V.watch, lit, V.players.map(function (p) {
    return [p.name, p.vp, p.handN, p.tracks, p.rangers, p.stacks.map(function (st) { return st.top[0]; }).join('')];
  })]);
  if (sig === WORLD.sig) return;
  WORLD.sig = sig;
  WORLD.puffs = [];
  $('world').innerHTML = worldLand(worldLayout(), lit);
  V.players.forEach(function (p, s) { WORLD.prev[s] = p.stacks.map(function (st) { return st.top; }); });
  WORLD.puffs.forEach(function (pf) { fxPuff(pf, pf.r, '#EFE7D2'); sfx('build'); });
}

/* ---- the fx layer: things that happen between the towns ---- */
function fxNode(html, life) {
  var host = $('worldfx');
  if (!host || !document.createElementNS || !host.appendChild) return null;
  try { if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return null; } catch (e) {}
  var g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('fill', 'none'); g.setAttribute('stroke', '#1C1A14');
  g.setAttribute('stroke-width', '1'); g.setAttribute('stroke-linejoin', 'round'); g.setAttribute('stroke-linecap', 'round');
  g.innerHTML = html;
  host.appendChild(g);
  setTimeout(function () { if (g.remove) g.remove(); }, life || 3000);
  return g;
}
function dockOf(seat) { var L = worldLayout()[seat]; return L ? L.dock : { x: 180, y: 170 }; }
function crownOf(seat) {
  var L = worldLayout()[seat];
  if (!L) return { x: 180, y: 120 };
  return { x: L.mid, y: L.fn(L.mid) - (L.far ? 26 * L.sc + 26 : 44) };
}
function fxBoat(a, b, col, dark, ms, sc) {
  var dx = b.x - a.x, dy = b.y - a.y;
  return fxNode('<g transform="translate(' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + ')">' +
    '<g class="fxsail" style="--dx:' + dx.toFixed(1) + 'px;--dy:' + dy.toFixed(1) + 'px;animation-duration:' + ms + 'ms">' +
    '<g transform="scale(' + ((dx < 0 ? -1 : 1) * (sc || 1)) + ' ' + (sc || 1) + ')">' + boatShape(col, dark) + '</g></g></g>', ms + 200);
}
function fxBubble(pt, text, col, delay) {
  setTimeout(function () {
    fxNode('<text class="fxbubble" x="' + pt.x.toFixed(1) + '" y="' + pt.y.toFixed(1) + '" font-size="12" font-weight="700" ' +
      'text-anchor="middle" fill="' + (col || '#F2EEE2') + '" stroke="#1C1A14" stroke-width="2.4" paint-order="stroke">' + esc(text) + '</text>', 1700);
  }, delay || 0);
}
function fxPuff(pt, r, col, delay) {
  setTimeout(function () {
    fxNode('<circle class="fxpuff" cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="' + (r || 8) + '" fill="' + (col || '#F2EEE2') + '" stroke="none"/>', 900);
  }, delay || 0);
}
function fxRings(pt, col) {
  [0, 260, 520].forEach(function (d) {
    setTimeout(function () {
      fxNode('<circle class="fxring" cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="10" stroke="' + (col || '#E8C57A') + '" stroke-width="1.6"/>', 1300);
    }, d);
  });
}
function fxFireworks(pt) {
  var cols = ['#E26A4B', '#E8C57A', '#3B8B82', '#5BB7E0', '#F2EEE2'];
  for (var i = 0; i < 9; i++) {
    fxPuff({ x: pt.x + (Math.random() - 0.5) * 120, y: pt.y - 10 - Math.random() * 50 }, 9 + Math.random() * 8, cols[i % 5], i * 230);
  }
}
function worldMood(cls, ms) {
  var w = $('worldwrap');
  if (!w || !w.classList) return;
  w.classList.remove(cls); void (w.offsetWidth || 0); w.classList.add(cls);
  setTimeout(function () { if (w.classList) w.classList.remove(cls); }, ms);
}

/* the event stream, played out on the water */
function worldEvents(evts) {
  if (!V || !evts || !evts.length) return;
  var raidedAny = evts.some(function (e) { return e.e === 'raided'; });
  evts.forEach(function (e) {
    if (e.e === 'draw') fxBubble(dockOf(e.seat), '+' + e.n, '#9FE0D6', 120 * e.seat);
    else if (e.e === 'tradeoffer') { fxRings(dockOf(e.from), SEATCOL[e.from % 4]); fxBubble(crownOf(e.from), 'Trade?', '#E8C57A'); }
    else if (e.e === 'tradein') fxBubble(crownOf(e.seat), 'In', '#E8C57A');
    else if (e.e === 'tradepass') fxBubble(crownOf(e.seat), 'Pass', '#B9C9BE');
    else if (e.e === 'tradeout' && e.accept) {
      fxBoat(dockOf(e.from), dockOf(e.by), SEATCOL[e.from % 4], false, 2600);
      fxBoat(dockOf(e.by), dockOf(e.from), SEATCOL[e.by % 4], false, 2600);
    }
    else if (e.e === 'gift') fxBoat(dockOf(e.from), dockOf(e.to), SEATCOL[e.from % 4], false, 2400, 0.8);
    else if (e.e === 'headline') {
      if (e.id === 'tide') worldMood('tide', 3000);
      if (e.id === 'season') {
        worldMood('season', 2800);
        for (var i = 0; i < 6; i++) {
          fxNode('<g transform="translate(-20 ' + (WORLD.far * 0.3 + i * 9).toFixed(1) + ')"><g class="fxsail" style="--dx:420px;--dy:' + (i % 2 ? -14 : 10) + 'px;animation-duration:' + (2600 + i * 180) + 'ms">' +
            '<path d="M-4 0q2 -3 4 0q2 -3 4 0" stroke="#F2EEE2" stroke-width="1.2"/></g></g>', 3800);
        }
      }
      if (e.id === 'raiders' && !raidedAny) fxBoat({ x: 384, y: WORLD.far + 70 }, { x: -24, y: WORLD.far + 52 }, '', true, 4200, 1.3);
    }
    else if (e.e === 'raided') {
      var d = dockOf(e.seat);
      fxBoat({ x: 384, y: WORLD.far + 62 }, d, '', true, 2000, 1.3);
      fxPuff(d, 16, '#E26A4B', 1950);
      fxBubble(crownOf(e.seat), '−' + e.n, '#E26A4B', 1950);
    }
    else if (e.e === 'token') fxBubble(crownOf(e.seat), e.which === 'highway' ? 'Highway' : 'Watch', '#E8C57A', 200);
    else if (e.e === 'win') fxFireworks(crownOf(e.seat));
  });
}

/* tap a town for its story; tap the things that drift for a hello */
function openPlayerSheet(seat) {
  var p = V.players[seat];
  if (!p) return;
  var count = function (k) { return p.stacks.filter(function (st) { return st.top === k; }).length; };
  var row = function (label, val) { return '<div class="opt" style="flex-direction:row;justify-content:space-between;cursor:default"><span class="ol">' + label + '</span><span class="ol">' + val + '</span></div>'; };
  openSheet('<h3><span style="width:14px;height:14px;border-radius:50%;background:' + SEATCOL[seat % 4] + ';display:inline-block;border:1.5px solid #1C1A14"></span> ' +
    esc(seat === MYSEAT ? 'Your town' : p.name) + '</h3>' +
    '<div class="sub">' + p.vp + ' of ' + H.WIN_VP + ' points showing, ' + p.handN + (p.handN === 1 ? ' card' : ' cards') + ' in hand.</div>' +
    row(art('shack', 20) + ' Shacks', count('shack')) + row(art('town', 20) + ' Towns', count('town')) +
    row(art('resort', 20) + ' Resorts', count('resort')) +
    row(art('track', 20) + ' Tracks', p.tracks + ' — swaps ' + ratioOf(p.tracks) + ' for 1') +
    row(art('ranger', 20) + ' Rangers', p.rangers + ' — keeps ' + (H.HAND_LIMIT + p.rangers) + ' from Raiders') +
    (V.highway === seat ? row('The Highway', '+2') : '') + (V.watch === seat ? row('The Watch', '+2') : ''));
}
function worldTap(e) {
  var t = e && e.target;
  if (!t || !t.closest || !V) return;
  var toy = t.closest('[data-toy]');
  if (toy) {
    if (toy.dataset.toy === 'boat') { sfx('trade'); banner('Ahoy'); }
    else if (toy.dataset.toy === 'buoy') { sfx('token'); fxRings({ x: 196, y: WORLD.far + (WORLD.near - WORLD.far) * 0.56 }, '#F6D77A'); }
    else sfx('draw');
    return;
  }
  var hit = t.closest('[data-seat]');
  if (hit) { sfx('tap'); openPlayerSheet(+hit.dataset.seat); }
}

function renderAll() {
  if (!V) return;
  renderWorld();

  var me = V.players[MYSEAT];
  var myTurn = V.turn === MYSEAT && !V.over;
  $('mine').classList.toggle('turn', myTurn);
  $('statusline').textContent = V.over ? '' :
    myTurn ? 'Your turn — build from the market, trade, or end.' :
    V.players[V.turn].name + ' is building.';

  $('mytop').innerHTML = '<b style="color:var(--bone);font-size:15px">' + esc(me.name) + '</b>' +
    '<span class="vpbadge">' + me.vp + ' of ' + H.WIN_VP + '</span>' +
    '<span>' + art('track', 14) + ' ' + me.tracks + ' — swaps ' + ratioOf(me.tracks) + ' for 1</span>' +
    '<span>' + art('ranger', 14) + ' ' + me.rangers + '</span>' +
    (V.highway === MYSEAT ? '<span class="tok">Highway</span>' : '') +
    (V.watch === MYSEAT ? '<span class="tok">Watch</span>' : '');

  var have = heldOf(MYHAND);
  var hand = $('hand');
  hand.innerHTML = '';
  H.GOODS.forEach(function (g) {
    var d = document.createElement('div');
    d.className = 'good' + (have[g] ? '' : ' zero');
    d.innerHTML = art(g) + '<span class="gn">' + H.GOOD_META[g].n + '</span>' +
      '<span class="gc">' + have[g] + '</span>';
    hand.appendChild(d);
  });

  var mk = $('market');
  mk.innerHTML = '';
  V.market.forEach(function (kind, i) {
    var b = H.BUILDS[kind];
    var can = myTurn && !!payCheck(b.cost, kind);
    var d = document.createElement('div');
    d.className = 'mcard' + (can ? ' canbuy' : '');
    d.innerHTML = art(kind) + '<span class="mname">' + b.n + '</span>' +
      '<span class="pips">' + costPips(b.cost, have) + '</span>';
    d.onclick = function () { sfx('tap'); openBuildSheet(kind, i); };
    mk.appendChild(d);
  });

  /* the Resort is always on offer: the sixth card, marked apart */
  var rc = document.createElement('div');
  var canR = myTurn && V.resorts > 0 && hasOpen('town') && !!payCheck(H.RESORT.cost, 'resort');
  rc.className = 'mcard standing' + (canR ? ' canbuy' : '') + (V.resorts > 0 ? '' : ' gone');
  rc.innerHTML = art('resort') + '<span class="mname">Resort</span>' +
    '<span class="pips">' + costPips(H.RESORT.cost, have) + '</span>';
  rc.onclick = function () { sfx('tap'); openBuildSheet('resort', 'resort'); };
  mk.appendChild(rc);
  $('counts').textContent = V.goodsN + ' goods, ' + V.deckN + ' builds and ' + V.eventsN + ' headlines left';

  $('tradebtn').classList.toggle('busy', !myTurn || V.tradeUsed || !!V.pendingTrade);
  $('endbtn').classList.toggle('busy', !myTurn);

  /* a healed or rejoined client reopens whichever trade sheet truth demands */
  var tr2 = V.pendingTrade;
  if (tr2 && !V.over) {
    if (!tr2.ready && tr2.from !== MYSEAT && !tr2.resp[MYSEAT] && !OFFER_OPEN && !PICK_OPEN) openOfferSheet(tr2);
    if (tr2.ready && tr2.from === MYSEAT && !PICK_OPEN) openPickSheet();
  }

  if (V.over) showOver();
}
function ratioOf(tracks) { return tracks >= 4 ? 1 : tracks === 3 ? 2 : tracks === 2 ? 3 : 4; }
function heldOf(hand) {
  var h = {};
  H.GOODS.forEach(function (g) { h[g] = 0; });
  hand.forEach(function (c) { h[c]++; });
  return h;
}
function hasOpen(kind) {
  return V.players[MYSEAT].stacks.some(function (st) { return st.top === kind; });
}
/* client-side affordability: mirrors the engine's payment rules on my hand */
function payCheck(cost, kind) {
  if (kind === 'town' && !hasOpen('shack')) return null;
  if (kind === 'resort' && !hasOpen('town')) return null;
  var have = heldOf(MYHAND), pay = {}, missing = null, missN = 0;
  Object.keys(cost).forEach(function (g) {
    var use = Math.min(cost[g], have[g]);
    pay[g] = use;
    if (use < cost[g]) { missing = g; missN += cost[g] - use; }
  });
  if (!missing) return { sub: null };
  if (missN > 1 || V.subUsed) return null;
  var K = ratioOf(V.players[MYSEAT].tracks);
  var from = null, best = -1;
  H.GOODS.forEach(function (g) {
    var spare = have[g] - (pay[g] || 0);
    if (g !== missing && spare >= K && spare > best) { best = spare; from = g; }
  });
  if (!from) return null;
  return { sub: { from: from, k: K, forGood: missing } };
}

/* ================= the sheet ================= */
function openSheet(html) {
  $('sheet').innerHTML = html;
  $('sheetwrap').classList.add('show');
}
function closeSheet() { $('sheetwrap').classList.remove('show'); }
$('sheetwrap').addEventListener('click', function (e) {
  if (e.target !== this) return;
  closeSheet();
  if (OFFER_OPEN) { OFFER_OPEN = false; sendMove({ t: 'tradeResp', accept: false }); }
});

function openBuildSheet(kind, slot) {
  var b = kind === 'resort' ? H.RESORT : H.BUILDS[kind];
  var myTurn = V.turn === MYSEAT && !V.over;
  var pc = myTurn ? payCheck(b.cost, kind) : null;
  var have = heldOf(MYHAND);
  var why = !myTurn ? 'Not your turn.' :
    (kind === 'town' && !hasOpen('shack')) ? 'Needs an open Shack to build over.' :
    (kind === 'resort' && !hasOpen('town')) ? 'Needs an open Town to build over.' :
    !pc ? 'You can’t cover the cost' + (V.subUsed ? ' (swap already used this turn).' : '.') : '';
  var subNote = pc && pc.sub ?
    'Swaps ' + pc.sub.k + ' ' + H.GOOD_META[pc.sub.from].n + ' for the ' + H.GOOD_META[pc.sub.forGood].n + '.' : '';
  var html = '<h3>' + art(kind === 'resort' ? 'resort' : kind) + ' ' + b.n + '</h3>' +
    '<div class="sub">' + esc(b.d) + '</div>' +
    '<div class="costrow">' + costPips(b.cost, have) + '</div>' +
    '<div class="opt' + (why ? ' off' : '') + '" id="buildgo"><span class="ol">Build</span>' +
    '<span class="oh">' + esc(why || subNote || 'Paid exactly.') + '</span></div>';
  if (kind === 'resort' && V.side === 'B' && !why) {
    html += '<div class="tlabel">Pick the Resort:</div>';
    V.resortBLeft.forEach(function (id) {
      var r = H.RESORT_B.find(function (x) { return x.id === id; });
      html += '<div class="opt bpick" data-id="' + id + '"><span class="ol">' + r.n + '</span>' +
        '<span class="oh">' + esc(r.d) + '</span></div>';
    });
  }
  openSheet(html);
  var go = $('buildgo');
  if (go && !why) {
    go.onclick = function () {
      closeSheet();
      sendMove({ t: 'build', slot: slot });
    };
  }
  Array.prototype.forEach.call(document.querySelectorAll('.bpick'), function (el) {
    el.onclick = function () {
      closeSheet();
      sendMove({ t: 'build', slot: 'resort', pick: el.dataset.id });
    };
  });
}
window.addEventListener('resize', function () { if (V && sizeWorld()) { WORLD.sig = ''; renderAll(); } });
$('world').addEventListener('click', worldTap);
$('worldbg').addEventListener('click', worldTap);

/* ---- trading ---- */
var TRADE = null;
function openTradeSheet() {
  if ($('tradebtn').classList.contains('busy')) return;
  TRADE = { give: [], want: [] };
  var html = '<h3>Trade</h3>' +
    '<div class="sub">The offer goes to the whole table — first to take it wins, ' +
    'and they draw a bonus card for saying yes.</div>' +
    '<div class="tlabel">You give:</div><div class="tradegrid" id="giveg"></div>' +
    '<div class="tlabel">You want:</div><div class="tradegrid" id="wantg"></div>' +
    '<div class="opt" id="tradego"><span class="ol">Put It to the Table</span><span class="oh" id="tradehint"></span></div>';
  openSheet(html);
  renderTradeGrids();
  $('tradego').onclick = function () {
    if (!TRADE.give.length || !TRADE.want.length) { banner('Pick both sides of the deal'); return; }
    closeSheet();
    sendMove({ t: 'trade', give: TRADE.give.slice(), want: TRADE.want.slice() });
  };
}
function renderTradeGrids() {
  var have = heldOf(MYHAND);
  var giveCount = {}, wantCount = {};
  TRADE.give.forEach(function (g) { giveCount[g] = (giveCount[g] || 0) + 1; });
  TRADE.want.forEach(function (g) { wantCount[g] = (wantCount[g] || 0) + 1; });
  var mk = function (host, counts, limitFn, other) {
    var el = $(host);
    el.innerHTML = '';
    H.GOODS.forEach(function (g) {
      var d = document.createElement('div');
      var dis = limitFn(g) || (other[g] || 0) > 0;
      d.className = 'tg' + (dis ? ' dis' : '');
      d.innerHTML = art(g, 24) + '<span class="gc">' + (counts[g] || 0) + '</span>';
      d.onclick = function () {
        sfx('tap');
        var list = host === 'giveg' ? TRADE.give : TRADE.want;
        list.push(g);
        renderTradeGrids();
      };
      el.appendChild(d);
    });
  };
  mk('giveg', giveCount, function (g) { return (giveCount[g] || 0) >= have[g]; }, wantCount);
  mk('wantg', wantCount, function (g) { return false; }, giveCount);
  var hint = $('tradehint');
  if (hint) hint.textContent = TRADE.give.length || TRADE.want.length ?
    TRADE.give.map(function (g) { return H.GOOD_META[g].n; }).join(' + ') + ' for ' +
    TRADE.want.map(function (g) { return H.GOOD_META[g].n; }).join(' + ') : 'Tap goods on each side.';
}
$('tradebtn').onclick = function () { sfx('tap'); openTradeSheet(); };
$('endbtn').onclick = function () {
  if (this.classList.contains('busy')) return;
  sfx('tap');
  sendMove({ t: 'end' });
};

var OFFER_OPEN = false;
function haveAll(goods) {
  var have = heldOf(MYHAND), need = {};
  goods.forEach(function (g) { need[g] = (need[g] || 0) + 1; });
  return Object.keys(need).every(function (g) { return have[g] >= need[g]; });
}
function openOfferSheet(tr) {
  var canTake = haveAll(tr.want);
  var html = '<h3>' + esc(V.players[tr.from].name) + ' puts a trade to the table</h3>' +
    '<div class="sub">' + tr.give.map(function (g) { return H.GOOD_META[g].n; }).join(' + ') +
    ' for your ' + tr.want.map(function (g) { return H.GOOD_META[g].n; }).join(' + ') +
    '. Once everyone answers, ' + esc(V.players[tr.from].name) +
    ' picks who gets the deal — the taker draws a bonus card.</div>' +
    '<div class="opt' + (canTake ? '' : ' off') + '" id="tacc"><span class="ol">I\u2019m In</span>' +
    (canTake ? '' : '<span class="oh">You don\u2019t hold what they want.</span>') + '</div>' +
    '<div class="opt" id="tdec"><span class="ol">Pass</span></div>';
  OFFER_OPEN = true;
  openSheet(html);
  $('tacc').onclick = function () { OFFER_OPEN = false; closeSheet(); sendMove({ t: 'tradeResp', accept: true }); };
  $('tdec').onclick = function () { OFFER_OPEN = false; closeSheet(); sendMove({ t: 'tradeResp', accept: false }); };
}
function openPickSheet() {
  var tr = V.pendingTrade;
  if (!tr) return;
  var takers = Object.keys(tr.resp).filter(function (k) { return tr.resp[k] === 'yes'; }).map(Number);
  var html = '<h3>Pick your trade</h3>' +
    '<div class="sub">' + takers.length + (takers.length === 1 ? ' bid' : ' bids') + ' on ' +
    tr.give.map(function (g) { return H.GOOD_META[g].n; }).join(' + ') + ' for ' +
    tr.want.map(function (g) { return H.GOOD_META[g].n; }).join(' + ') + '.</div>' +
    takers.map(function (s2) {
      return '<div class="opt pickwho" data-s="' + s2 + '"><span class="ol">' + esc(V.players[s2].name) +
        '</span><span class="oh">' + V.players[s2].vp + ' points, ' + V.players[s2].handN + ' cards</span></div>';
    }).join('') +
    '<div class="opt" id="walkaway"><span class="ol">Walk Away</span><span class="oh">Keeps your trade for this turn.</span></div>';
  PICK_OPEN = true;
  openSheet(html);
  Array.prototype.forEach.call(document.querySelectorAll('.pickwho'), function (el) {
    el.onclick = function () { PICK_OPEN = false; closeSheet(); sendMove({ t: 'tradePick', taker: +el.dataset.s }); };
  });
  $('walkaway').onclick = function () { PICK_OPEN = false; closeSheet(); sendMove({ t: 'tradePick', taker: -1 }); };
}
var PICK_OPEN = false;

/* ================= events at the glass ================= */
var HFLASHT = null;
function flashHeadline(id) {
  var h = H.HEADLINES.find(function (x) { return x.id === id; });
  if (!h) return;
  var f = $('headlineflash');
  f.querySelector('.hn').textContent = h.n;
  f.querySelector('.hd').textContent = h.d;
  f.classList.add('show');
  sfx('headline');
  clearTimeout(HFLASHT);
  HFLASHT = setTimeout(function () { f.classList.remove('show'); }, 2100);
}

function nameOf(s) { return s === MYSEAT ? 'You' : (V.players[s] ? V.players[s].name : '?'); }
function sayEvents(evts) {
  if (!V) return;
  worldEvents(evts);
  (evts || []).forEach(function (e) {
    if (e.e === 'headline') flashHeadline(e.id);
    else if (e.e === 'built') {
      var nm = e.kind === 'resort' ? 'a Resort' :
        e.kind === 'town' ? 'a Town' : e.kind === 'shack' ? 'a Shack' :
        e.kind === 'ranger' ? 'a Ranger' : 'a Track';
      if (e.seat !== MYSEAT) banner(nameOf(e.seat) + ' raises ' + nm);
      if (e.kind === 'track' || e.kind === 'ranger') sfx('build');
    }
    else if (e.e === 'token') {
      banner(nameOf(e.seat) + (e.seat === MYSEAT ? ' take the ' : ' takes the ') +
        (e.which === 'highway' ? 'Highway' : 'Watch'));
      sfx('token');
    }
    else if (e.e === 'raided') {
      banner(nameOf(e.seat) + (e.seat === MYSEAT ? ' lose ' : ' loses ') + e.n + ' to the Raiders');
      if (e.seat === MYSEAT) { haptic(60); sfx('sting'); }
    }
    else if (e.e === 'gift') banner(nameOf(e.from) + ' hands one to ' + nameOf(e.to));
    else if (e.e === 'sub' && e.seat === MYSEAT)
      banner('Swapped ' + e.k + ' ' + H.GOOD_META[e.from].n + ' for the ' + H.GOOD_META[e.forGood].n);
    else if (e.e === 'tradeoffer') {
      sfx('trade');
      if (e.from !== MYSEAT) openOfferSheet(e);
    }
    else if (e.e === 'tradebids') {
      if (e.from === MYSEAT) { sfx('trade'); openPickSheet(); }
      else banner('Bids are in — ' + nameOf(e.from) + ' is choosing');
    }
    else if (e.e === 'tradeout') {
      if (OFFER_OPEN) { OFFER_OPEN = false; closeSheet(); }
      if (PICK_OPEN) { PICK_OPEN = false; closeSheet(); }
      banner(e.accept ? nameOf(e.from) + ' trades with ' + nameOf(e.by) :
        (e.walked ? nameOf(e.from) + ' walks away' : 'No bids'));
      if (e.accept) sfx('trade');
    }
    else if (e.e === 'tradein') {
      if (e.seat !== MYSEAT) banner(nameOf(e.seat) + ' is in');
    }
    else if (e.e === 'tradepass') {
      if (e.seat !== MYSEAT) banner(nameOf(e.seat) + ' passes');
    }
    else if (e.e === 'turn') {
      if (e.seat === MYSEAT) { banner('Your turn'); haptic(12); }
    }
    else if (e.e === 'harvest') sfx('draw');
    else if (e.e === 'marketflush') banner('The market flushes — five of a kind');
    else if (e.e === 'win') { sfx('win'); if (e.seat === MYSEAT) confetti(); }
  });
}

function showOver() {
  var won = V.winner === MYSEAT;
  $('overtitle').textContent = won ? 'The coast is yours' : esc(V.players[V.winner].name) + ' takes the coast';
  $('oversub').textContent = won ? 'Seven showing. Clean.' :
    (MODE === 'client' ? 'The host deals the next one.' : 'Next one’s yours.');
  $('againbtn').style.display = (MODE === 'client') ? 'none' : '';
  show('over');
}
$('againbtn').onclick = function () {
  hide('over');
  if (MODE === 'bot') startBot(BOTN);
  else if (MODE === 'host') hostDeal();
};
$('menubtn').onclick = function () { location.reload(); };

/* ================= practice ================= */
var BOTN = 1, BOTCLOCK = null;
function myName() {
  var v = $('namein').value.trim();
  if (v) { try { localStorage.setItem('it_name', v); } catch (e) {} }
  return v || 'You';
}
function startBot(n) {
  BOTN = n;
  MODE = 'bot';
  MYSEAT = 0;
  ROSTER_NAMES = [myName()].concat(['Sandy', 'Reef', 'Dune'].slice(0, n));
  ENGINE = H.newGame(ROSTER_NAMES, (Math.random() * 1e9) | 0);
  hide('menu'); hide('over'); show('game');
  document.body.classList.add('playing');
  syncFromEngine([]);
  botClock();
}
function syncFromEngine(evts) {
  V = publicView(ENGINE, ROSTER_NAMES);
  MYHAND = ENGINE.players[MYSEAT].hand.slice();
  sayEvents(evts);
  renderAll();
}
function botClock() {
  clearTimeout(BOTCLOCK);
  if (MODE !== 'bot' || !ENGINE || ENGINE.over) return;
  /* a bot with something to do: an unanswered offer first, then the turn-holder.
     If only the human's answer is missing, the table waits for them. */
  var seat = -1;
  var tr = ENGINE.pendingTrade;
  if (tr && !tr.ready) {
    for (var s2 = 0; s2 < ENGINE.players.length; s2++) {
      if (s2 !== MYSEAT && s2 !== tr.from && !tr.resp[s2]) { seat = s2; break; }
    }
  } else if (tr && tr.ready && tr.from !== MYSEAT) seat = tr.from;
  else if (!tr && ENGINE.turn !== MYSEAT) seat = ENGINE.turn;
  if (seat < 0) return;
  BOTCLOCK = setTimeout(function () {
    var mv = H.botMove(ENGINE, seat);
    if (!mv) return;
    var r = H.apply(ENGINE, seat, mv);
    if (r.ok) syncFromEngine(r.evts);
    botClock();
  }, 700);
}

$('practicebtn').onclick = function () {
  var html = '<h3>Practice</h3><div class="sub">Against the locals.</div>' +
    [1, 2, 3].map(function (n) {
      return '<div class="opt botn" data-n="' + n + '"><span class="ol">' + n +
        ' bot' + (n > 1 ? 's' : '') + '</span></div>';
    }).join('');
  openSheet(html);
  Array.prototype.forEach.call(document.querySelectorAll('.botn'), function (el) {
    el.onclick = function () { closeSheet(); startBot(+el.dataset.n); };
  });
};

/* ================= the wire ================= */
function netEvents() { return ['intent', 'state', 'hand', 'start', 'nack']; }

function sendMove(move) {
  if (MODE === 'bot') {
    var r = H.apply(ENGINE, MYSEAT, move);
    if (r.ok) { syncFromEngine(r.evts); botClock(); }
    else { banner('Not that one'); }
    return;
  }
  if (MODE === 'host') {
    var r2 = H.apply(ENGINE, MYSEAT, move);
    if (r2.ok) hostPush(r2.evts);
    else banner('Not that one');
    return;
  }
  if (MODE === 'client') TX.send('intent', { key: TX.key, seat: MYSEAT, move: move });
}

function hostPush(evts) {
  V = publicView(ENGINE, ROSTER_NAMES);
  MYHAND = ENGINE.players[MYSEAT].hand.slice();
  TX.send('state', { v: V, evts: evts || [] });
  ENGINE.players.forEach(function (p, s) {
    if (s !== MYSEAT) TX.send('hand', { seat: s, cards: p.hand });
  });
  sayEvents(evts);
  renderAll();
}

function onWire(ev, m) {
  if (MODE === 'host' || HOSTING) {
    if (ev === 'intent') {
      if (!ENGINE || MODE !== 'host') return;             // no intents before the deal
      var seat = seatOfKey(m.key);
      if (seat < 0 || seat !== m.seat) return;              // a seat speaks only for itself
      var r = H.apply(ENGINE, seat, m.move);
      if (r.ok) hostPush(r.evts);
      else TX.send('nack', { seat: seat });
    }
    return;
  }
  if (ev === 'start') {
    ROSTER = m.roster;
    ROSTER_NAMES = m.roster.map(function (r) { return r.name; });
    MYSEAT = m.roster.findIndex(function (r) { return r.key === TX.key; });
    if (MYSEAT < 0) { banner('The table filled without you'); return; }
    MODE = 'client';
    document.body.classList.add('playing');
    hide('room'); show('game'); hide('over');
    closeSheet();
  } else if (ev === 'state') {
    if (MODE !== 'client') return;
    V = m.v;
    sayEvents(m.evts);
    renderAll();
  } else if (ev === 'hand') {
    if (MODE !== 'client' || m.seat !== MYSEAT) return;
    MYHAND = m.cards;
    renderAll();
  } else if (ev === 'nack') {
    if (MODE === 'client' && m.seat === MYSEAT) { banner('Not that one'); renderAll(); }
  }
}

function seatOfKey(key) {
  if (!ROSTER) return -1;
  return ROSTER.findIndex(function (r) { return r.key === key; });
}

var HEALT = null;
function onPresence() {
  if (MODE === 'host' && ENGINE) {
    clearTimeout(HEALT);
    HEALT = setTimeout(function () { if (MODE === 'host' && ENGINE) hostPush([]); }, 600);
  }
  if ($('room').classList.contains('hidden')) return;
  renderRoom();
}

function renderRoom() {
  var seats = TableKit.seatsFrom(TX.presence(), 4);
  var list = $('seatlist');
  list.innerHTML = '';
  seats.forEach(function (s) {
    var d = document.createElement('div');
    d.className = 'seatrow';
    d.innerHTML = '<span class="dot"></span><span>' + esc(s.name || 'Guest') + '</span>' +
      (s.host ? '<span class="hosttag">HOST</span>' : '');
    list.appendChild(d);
  });
  if (HOSTING) {
    $('startbtn').style.display = '';
    $('startbtn').classList.toggle('busy', seats.length < 2);
    $('roomhint').textContent = seats.length < 2 ? 'Share the code — the game starts at two.' : '';
  } else {
    $('startbtn').style.display = 'none';
    $('roomhint').textContent = 'Waiting for the host to deal.';
  }
}

var joining = false;
async function joinRoom(code, asHost) {
  if (joining) return;
  joining = true;
  $('neterr').textContent = '';
  try {
    TX = await TableKit.join({
      prefix: 'headlands', code: code, events: netEvents(),
      onMessage: onWire, onPresence: onPresence,
      meta: { key: TableKit.pkey(), host: asHost, name: myName() },
    });
    HOSTING = asHost;
    CODE = code;
    hide('menu'); show('room');
    $('codeshow').textContent = code;
    renderRoom();
  } catch (e) {
    $('neterr').textContent = String(e.message || e);
  }
  $('hostbtn').classList.remove('busy');
  $('joinbtn').classList.remove('busy');
  joining = false;
}

function hostDeal() {
  var seats = TableKit.seatsFrom(TX.presence(), 4);
  if (seats.length < 2) return;
  ROSTER = seats.map(function (s) { return { key: s.key, name: s.name || 'Guest' }; });
  ROSTER_NAMES = ROSTER.map(function (r) { return r.name; });
  MYSEAT = ROSTER.findIndex(function (r) { return r.key === TX.key; });
  MODE = 'host';
  ENGINE = H.newGame(ROSTER_NAMES, (Math.random() * 1e9) | 0);
  TX.send('start', { roster: ROSTER });
  document.body.classList.add('playing');
  hide('room'); show('game'); hide('over');
  closeSheet();
  hostPush([]);
}

$('hostbtn').onclick = function () { this.classList.add('busy'); joinRoom(TableKit.roomCode(), true); };
$('joinbtn').onclick = function () {
  var code = $('codein').value.trim().toUpperCase();
  if (code.length !== 4) { $('neterr').textContent = 'Codes are four letters.'; return; }
  this.classList.add('busy');
  joinRoom(code, false);
};
$('startbtn').onclick = function () { hostDeal(); };
$('leaveroom').onclick = function () { location.reload(); };

/* ---- boot ---- */
(function () {
  var saved = '';
  try { saved = localStorage.getItem('it_name') || ''; } catch (e) {}
  $('namein').value = saved;
  var qp = new URLSearchParams(location.search);
  var code = (qp.get('join') || '').toUpperCase();
  if (code.length === 4) { $('codein').value = code; joinRoom(code, false); }
})();
</script>
